<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Starmise — Portafolio interactivo</title>
    <meta name="description" content="Portafolio interactivo de Luis Rosaldo (Starmise), Game Developer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" hidden>
      <p id="prompt" hidden><kbd data-key>E</kbd> <span data-verb>Examinar</span> · <span data-label></span></p>
      <p id="toast" role="status" hidden></p>
      <div id="hud-bottom">
        <p id="help"></p>
        <p id="status"></p>
      </div>
    </div>

    <div id="fade" hidden></div>
    <p id="door-loading" hidden>Cargando…</p>
    <div id="ui"></div>

    <noscript>
      <p style="padding: 16px; font-size: 20px">
        Este portafolio necesita JavaScript.
        <a href="https://starmise.github.io/About-Me-Website/" style="color: #d8d2c4">Ver la versión clásica</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
